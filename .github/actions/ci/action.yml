name: CI Workflow
description: 'Shared CI workflow.'
inputs:
  run_tests:
    description: 'If true, run unit tests, otherwise skip them.'
    required: false
    default: 'true'
  resolver:
    description: 'Which resolver to use when building the package'
    required: false
    default: 'lts-16.31'
  ghc-version:
    description: 'The GHC version that the resolver uses'
    required: false
    default: '8.8.4'

runs:
  using: composite
  steps:
    - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
      with:
        ghc-version: ${{ inputs.ghc-version }}
        enable-stack: true

    - uses: ./.github/actions/use-default-linker

    # Use the GHC that the setup step installed. Without this, stack
    # downloads a second copy of GHC.
    - name: Configure stack to use the installed GHC
      shell: bash
      run: stack config set system-ghc --global true

    - name: Build library
      shell: bash
      run: stack --no-terminal --resolver=${{ inputs.resolver }} build

    - name: Build sdist distribution
      shell: bash
      run: stack --no-terminal --resolver=${{ inputs.resolver }} sdist

    - name: Run tests
      shell: bash
      run: stack --no-terminal --resolver=${{ inputs.resolver }} test
      if: ${{ inputs.run_tests == 'true' }}
